<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="registroestilo.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro</title>
   
</head>
<body>
  <form action="login.html">
  <section class="h-100 h-custom gradient-custom-2">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12">
          <div class="card card-registration card-registration-2" style="border-radius: 15px;">
            <div class="card-body p-0">
              <div class="row g-0">
                <div class="col-lg-6">
                  <div class="p-5">
                    <h3 class="fw-normal mb-5" style="color: #24bc7a;">Informacion General</h3>
  
                    
  
                    <div class="row">
                      <div class="col-md-6 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline">
                          <input type="text" id="form3Examplev2" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplev2">Nombre</label>
                        </div>
  
                      </div>
                      <div class="col-md-6 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline">
                          <input type="text" id="form3Examplev3" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplev3">Apellidos</label>
                        </div>
                      </div>
                    </div>
                    
                    <div class="row">
                      <div class="col-md-12 mb-4 pb-2 ">
                            <div data-mdb-input-init class="form-outline form-white">
                            <input type="email" id="form3Examplea9" class="form-control form-control-lg" required/>
                            <label class="form-label" for="form3Examplea9">Correo Electronico</label>
                          </div>
                      </div>
                    </div>

                    <div class="row">
                      <div class="col-md-3 mb-4 pb-2">
                        <div data-mdb-input-init class="form-outline">
                          <input type="number" id="form3Examplev2" class="form-control form-control-lg" value="52"required/>
                          <label class="form-label" for="form3Examplev2">Lada</label>
                        </div>
                      </div>
                      <div class="col-md-9 mb-4 pb-2">
                        <div data-mdb-input-init class="form-outline">
                          <input type="number" id="form3Examplev3" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplev3">Numero Telefonico</label>
                        </div>
                      </div>
                    </div>

                    <div class="row">
                      <!-- Columna para la Fecha de Nacimiento -->
                      <div class="col-md-6 mb-4 pb-2">
                          <div data-mdb-input-init class="form-outline">
                              <input type="date" id="form3Examplev2" class="form-control form-control-lg" required/>
                              <label class="form-label" for="form3Examplev2">Fecha de Nacimiento</label>
                          </div>
                      </div>
                  
                      <!-- Columna para el Género -->
                      <div class="col-md-6 mb-4 pb-2">
                          <div class="form-outline">
                              <select id="genderSelect" class="form-control form-control-lg" required> 
                                  <option value="" disabled selected>Elije una opcion</option>
                                  <option value="femenino">Femenino</option>
                                  <option value="masculino">Masculino</option>
                                  <option value="otro">Otro</option>
                              </select>
                              <label for="genderSelect" class="form-label">Género</label>

                          </div>
                      </div>
                  </div>
                  
                  

                  <div class="form-check d-flex justify-content-start mb-4 pb-3">
                    <input class="form-check-input me-3" type="checkbox" value="" id="form2Example3c" required/>
                    <label class="form-check-label " for="form2Example3">
                      Acepto los <a href="TerminosCondiciones.html" style="color:#24bc7a;"><u>Terminos y Condiciones</u></a> de Este Sitio Web
                    </label>
                  </div>
                 </div>
                </div>
                <div class="col-lg-6 bg-indigo text-white ">
                  <div class="p-5">
                    <h3 class="fw-normal mb-5">Domicilio</h3>
                    
                    <div class="row">
                      <div class="col-md-9 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline form-white">
                          <input type="text" id="form3Examplea4" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplea4">Calle</label>
                        </div>
  
                      </div>
                      <div class="col-md-3 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline form-white">
                          <input type="number" id="form3Examplea5" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplea5">No. Exterior</label>
                        </div>
  
                      </div>
                    </div>
                    <div class="mb-4 pb-2">
                      <div data-mdb-input-init class="form-outline form-white">
                        <input type="text" id="form3Examplea3" class="form-control form-control-lg" required />
                        <label class="form-label" for="form3Examplea3">Fraccionamiento / Colonia</label>
                      </div>
                    </div>
  
                    <div class="row">
                      <div class="col-md-5 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline form-white">
                          <input type="number" id="form3Examplea4" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplea4">Codigo Postal</label>
                        </div>
  
                      </div>
                      <div class="col-md-7 mb-4 pb-2">
  
                        <div data-mdb-input-init class="form-outline form-white">
                          <input type="text" id="form3Examplea5" class="form-control form-control-lg" required/>
                          <label class="form-label" for="form3Examplea5">Ciudad</label>
                        </div>
  
                      </div>
                    </div>
  
                    <div class="mb-4 pb-2">
                      <div data-mdb-input-init class="form-outline form-white">
                        <input type="text" id="form3Examplea6" class="form-control form-control-lg"required />
                        <label class="form-label" for="form3Examplea6">Pais</label>
                      </div>
                    </div>

                   
  
                    <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-light btn-lg"
                  data-mdb-ripple-color="dark" >Registrarse</button>
                   
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</form>
</body>
</html>
